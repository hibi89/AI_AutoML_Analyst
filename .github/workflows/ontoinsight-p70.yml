name: ONTOINSIGHT P70 multi-source and approval proof
on:
  push:
    branches:
      - feature/ontoinsight-ax-p70-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p70-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-verified-py311.txt
      - name: ONTOINSIGHT P50/P70 original-source tests
        run: python -m pytest -q tests/test_ontoinsight_p50.py tests/test_ontoinsight_p70.py
      - name: Python compile
        run: python -m compileall -q backend/app/services/ontoinsight_p50.py backend/app/services/ontoinsight_p70.py scripts/ontoinsight_p70_cli.py
