name: AutoML baseline and BASIC MVP smoke

on:
  push:
    branches:
      - feature/kmong-v1
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "requirements-ci.txt"
      - ".github/workflows/baseline-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install smoke dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Original source import
        run: python -c "from backend.app.main import app; print('FastAPI original import OK', app.version)"
      - name: Original AutoML and BASIC MVP HTTP smoke
        run: python -m pytest -q tests
