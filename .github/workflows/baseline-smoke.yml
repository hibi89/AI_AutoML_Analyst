name: AutoML baseline and BASIC MVP smoke

on:
  push:
    branches:
      - feature/kmong-v1
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "scripts/create_basic_preview.py"
      - "scripts/p6_benchmark.py"
      - "scripts/p6c_model_benchmark.py"
      - "requirements-ci.txt"
      - ".github/workflows/baseline-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Korean PDF font and raster renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum poppler-utils
      - name: Install smoke dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Original source import
        run: python -c "from backend.app.main import app; print('FastAPI original import OK', app.version)"
      - name: Original AutoML and BASIC MVP HTTP smoke
        run: python -m pytest -q tests
      - name: Create synthetic PDF and full-page raster previews
        run: python -m scripts.create_basic_preview
      - name: Upload synthetic visual review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basic-synthetic-pdf-review
          path: ci-preview/
          if-no-files-found: error
          retention-days: 7
      - name: Benchmark synthetic BASIC upper-bound 20k rows x 50 columns
        run: python -m scripts.p6_benchmark
      - name: Upload time and RSS benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: p6-synthetic-performance
          path: ci-benchmarks/p6_basic_20000x50.json
          if-no-files-found: error
          retention-days: 7
      - name: Benchmark real CV and holdout (STANDARD and PREMIUM)
        run: python -m scripts.p6c_model_benchmark
      - name: Upload ML training time and RSS
        uses: actions/upload-artifact@v4
        with:
          name: p6c-synthetic-ml-performance
          path: ci-benchmarks/p6c_model_120_400_2000.json
          if-no-files-found: error
          retention-days: 7
