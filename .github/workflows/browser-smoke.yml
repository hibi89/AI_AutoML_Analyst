name: AutoML real Chromium download smoke
on:
  push:
    branches:
      - feature/kmong-v1
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/p6_browser_smoke.py"
      - "requirements-ci.txt"
      - "requirements-verified-py311.txt"
      - "requirements-browser.txt"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-real-download:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-verified-py311.txt
      - name: Install Korean font, Python and browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum fonts-arphic-uming
          python -m pip install -r requirements-verified-py311.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Upload and download all SKU ZIPs through Chromium
        run: python -m scripts.p6_browser_smoke
