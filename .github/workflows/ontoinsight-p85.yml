name: ONTOINSIGHT P85 ML security and offline delivery
on:
  push:
    branches:
      - feature/ontoinsight-ax-p85-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ontoinsight-p85:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original verified runtime
        run: python -m pip install -r requirements-verified-py311.txt
      - name: All P50 P70 and new P85 tests
        run: python -m pytest -q tests/test_ontoinsight_p50.py tests/test_ontoinsight_p70.py tests/test_ontoinsight_p70_cli.py tests/test_ontoinsight_p85_ml.py tests/test_ontoinsight_p85_report.py tests/test_ontoinsight_p85_core_edges.py tests/test_ontoinsight_p85_math.py tests/test_ontoinsight_p85_delivery_cli.py
      - name: Independently rerun distinct 30 core quality/security cases
        run: python -m scripts.ontoinsight_p85_core30_gate
      - name: Python compile
        run: python -m compileall -q backend/app/services/ontoinsight_p50.py backend/app/services/ontoinsight_p70.py backend/app/services/ontoinsight_p85_ml.py backend/app/services/ontoinsight_p85_report.py scripts/ontoinsight_p85_delivery_cli.py scripts/ontoinsight_p85_core30_gate.py
