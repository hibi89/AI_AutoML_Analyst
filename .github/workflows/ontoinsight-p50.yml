name: ONTOINSIGHT P50 safe CSV proof
on:
  push:
    branches:
      - feature/ontoinsight-ax-p50-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-p50:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-verified-py311.txt
      - run: python -m pytest -q tests/test_ontoinsight_p50.py
      - run: python -m compileall -q backend/app/services/ontoinsight_p50.py scripts/ontoinsight_p50_review.py
