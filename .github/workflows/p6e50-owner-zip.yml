name: AutoML P6E50-P6E52 offline owner delivery review
on:
  push:
    branches: [feature/kmong-p6e50-owner-delivery-20261112]
  pull_request:
    paths:
      - "scripts/p6e50_owner_zip_review.py"
      - "scripts/p6e51_owner_three_tier_review.py"
      - "tests/test_p6e50_owner_zip_review.py"
      - "tests/test_p6e51_owner_three_tier_review.py"
      - "tests/test_p6e52_real_three_tier_delivery.py"
      - "scripts/p6e6_delivery_policy.py"
      - ".github/workflows/p6e50-owner-zip.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-owner-zip-review:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent ZIP/PDF review test dependencies only
        run: python -m pip install "pytest>=8,<10" "pypdf>=5,<7" "reportlab>=4.2,<5"
      - name: Compile existing and new review modules
        run: python -m py_compile scripts/p6e50_owner_zip_review.py scripts/p6e51_owner_three_tier_review.py scripts/p6e6_delivery_policy.py
      - name: Actual archive/PDF/manifest/three-tier negative and original policy regressions
        run: python -m pytest -q tests/test_p6e50_owner_zip_review.py tests/test_p6e51_owner_three_tier_review.py tests/test_p6e6_delivery_policy.py
  original-three-tier-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-verified-py311.txt
      - name: Install system fonts for owner-only synthetic PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum fonts-arphic-uming
      - name: Install original pinned AutoML synthetic runtime
        run: python -m pip install -r requirements-verified-py311.txt
      - name: Generate real BASIC STANDARD PREMIUM ZIP and validate as one owner review
        run: python -m pytest -q tests/test_p6e52_real_three_tier_delivery.py
