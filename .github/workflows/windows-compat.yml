name: AutoML Windows native no-GUI compatibility

on:
  push:
    branches:
      - feature/kmong-v1
    paths:
      - "backend/**"
      - "tests/test_p6_windows_compat.py"
      - "tests/test_original_smoke.py"
      - "tests/test_p2_ml_validity.py"
      - "tests/test_p6_security.py"
      - "requirements-ci.txt"
      - "requirements-verified-py311.txt"
      - ".github/workflows/windows-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-311:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-verified-py311.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-verified-py311.txt
      - name: Verify native Python and skops without GUI
        run: python -m pytest -q tests/test_p6_windows_compat.py tests/test_original_smoke.py tests/test_p2_ml_validity.py tests/test_p6_security.py
