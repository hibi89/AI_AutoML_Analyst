name: AutoML Windows native no-GUI compatibility

on:
  push:
    branches:
      - feature/kmong-v1
    paths:
      - "backend/**"
      - "scripts/windows_release_qa.ps1"
      - "scripts/p6e5_windows_demo.py"
      - "tests/test_p6e5_local_demo.py"
      - "scripts/p6e6_delivery_policy.py"
      - "tests/test_p6e6_delivery_policy.py"
      - "tests/test_p6_windows_compat.py"
      - "tests/test_original_smoke.py"
      - "tests/test_p2_ml_validity.py"
      - "tests/test_p6_security.py"
      - "requirements-ci.txt"
      - "requirements-verified-py311.txt"
      - ".github/workflows/windows-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-311:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-verified-py311.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-verified-py311.txt
      - name: Parse physical Windows release QA helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/windows_release_qa.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Verify Windows Python 3.11 launcher fallback without modifying global Python
        shell: pwsh
        run: |
          $selected = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows_release_qa.ps1 -ProbeOnly
          if ($LASTEXITCODE -ne 0 -or $selected -notmatch '^PYTHON311_LAUNCHER=') {
            throw "Python 3.11 preflight failed"
          }
          # Simulate a registered but unusable 'py' while keeping valid Python on PATH.
          $shimDir = Join-Path $env:RUNNER_TEMP "automl-python-probe"
          New-Item -ItemType Directory -Path $shimDir -Force | Out-Null
          Set-Content -Path (Join-Path $shimDir "py.cmd") -Value "@echo off`r`nexit /b 1" -Encoding Ascii
          $previousPath = $env:PATH
          try {
            $env:PATH = "$shimDir;$previousPath"
            $fallback = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows_release_qa.ps1 -ProbeOnly
            if ($LASTEXITCODE -ne 0 -or $fallback -ne "PYTHON311_LAUNCHER=python") {
              throw "Valid Python 3.11 fallback was not selected"
            }
          } finally {
            $env:PATH = $previousPath
          }
      - name: Verify local port collision refuses an unrelated service
        shell: pwsh
        run: |
          # Bind a random local test port; no access to customer machines or network.
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = [int]$listener.LocalEndpoint.Port
          $stdout = Join-Path $env:RUNNER_TEMP "automl-port-check.stdout"
          $stderr = Join-Path $env:RUNNER_TEMP "automl-port-check.stderr"
          try {
            $proc = Start-Process -FilePath "powershell.exe" -ArgumentList @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
              "scripts/windows_release_qa.ps1", "-PortProbeOnly", "-Port", "$port"
            ) -PassThru -Wait -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if ($proc.ExitCode -eq 0) { throw "Occupied port was incorrectly accepted" }
            if ((Get-Content $stderr -Raw) -notmatch "already occupied") {
              throw "Busy-port rejection did not explain the conflict"
            }
          } finally {
            $listener.Stop()
          }
          $available = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows_release_qa.ps1 -PortProbeOnly -Port $port
          if ($LASTEXITCODE -ne 0 -or ($available -join "").Trim() -ne "LOCAL_PORT_AVAILABLE=$port") {
            throw "Released local port was incorrectly rejected"
          }
      - name: Verify health identity against real AutoML and unrelated loopback server
        shell: pwsh
        run: |
          # Use a disposable localhost port on this GitHub runner, not user machine.
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = [int]$listener.LocalEndpoint.Port
          $listener.Stop()
          $actual = Start-Process -FilePath python -ArgumentList @(
            "-m", "uvicorn", "backend.app.main:app", "--host", "127.0.0.1", "--port", "$port"
          ) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 50; $i++) {
              if ($actual.HasExited) { throw "Actual AutoML process exited early" }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 150 }
            }
            if (-not $ready) { throw "AutoML server failed to start on test port" }
            $ok = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows_release_qa.ps1 -IdentityProbeOnly -Port $port
            if ($LASTEXITCODE -ne 0 -or ($ok -join "").Trim() -ne "AUTOML_SERVER_IDENTITY=PASS") {
              throw "Actual AutoML identity was incorrectly rejected"
            }
          } finally {
            Stop-Process -Id $actual.Id -Force -ErrorAction SilentlyContinue
          }
          $foreign = Start-Process -FilePath python -ArgumentList @(
            "-m", "http.server", "$port", "--bind", "127.0.0.1"
          ) -PassThru -WindowStyle Hidden
          $stdout = Join-Path $env:RUNNER_TEMP "automl-foreign-health.stdout"
          $stderr = Join-Path $env:RUNNER_TEMP "automl-foreign-health.stderr"
          try {
            $ready = $false
            for ($i = 0; $i -lt 35; $i++) {
              if ($foreign.HasExited) { throw "Foreign test service exited early" }
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 150 }
            }
            if (-not $ready) { throw "Foreign test server failed to start" }
            $result = Start-Process -FilePath powershell.exe -ArgumentList @(
              "-NoProfile", "-ExecutionPolicy", "Bypass", "-File",
              "scripts/windows_release_qa.ps1", "-IdentityProbeOnly", "-Port", "$port"
            ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if ($result.ExitCode -eq 0) { throw "Unrelated server identity was accepted" }
            if ((Get-Content $stderr -Raw) -notmatch "not serving the expected") {
              throw "Unrelated server rejected without expected error"
            }
          } finally {
            Stop-Process -Id $foreign.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Verify native Python and skops without GUI
        run: python -m pytest -q tests/test_p6_windows_compat.py tests/test_original_smoke.py tests/test_p2_ml_validity.py tests/test_p6_security.py tests/test_p6d_ml_limits.py tests/test_p6e5_local_demo.py tests/test_p6e6_delivery_policy.py
